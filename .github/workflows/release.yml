name: Release

# Builds the WordPress-ready zip and attaches it to the release, replacing any
# zip of the same name that was uploaded by hand.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the zip to, e.g. v0.1.0
        required: true

permissions:
  contents: write

jobs:
  zip:
    name: Attach sokolipa-checkout.zip
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Build the zip
        run: bash bin/build-zip.sh

      - name: Upload it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/sokolipa-checkout.zip --clobber --repo "$GITHUB_REPOSITORY"
